# ==============================================================================
# .github/workflows/daily-cron.yml
# Daily Automated Expiry & Archiving Cron for PakInternships
# Runs daily at 02:00 PKT (21:00 UTC)
# ==============================================================================

name: Daily Expiry & Archive Cron (02:00 PKT)

on:
  schedule:
    # 21:00 UTC = 02:00 Pakistan Standard Time (PKT)
    - cron: '0 21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  run-expiry-check:
    name: Execute Expiry State Transitions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Execute Daily Expiry & Archive Script
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npx tsx scripts/cron_expiry.ts
