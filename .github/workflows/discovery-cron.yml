# ==============================================================================
# .github/workflows/discovery-cron.yml
# Automated Pakistan Career Radar & Discovery Engine
# Runs automatically every Monday & Thursday at 06:00 PKT (01:00 UTC)
# Stages fresh recruitment intakes across Pakistan into pending_review queue
# ==============================================================================

name: Automated Pakistan Career Radar (Discovery)

on:
  schedule:
    # 01:00 UTC = 06:00 Pakistan Standard Time (PKT) on Monday & Thursday
    - cron: '0 1 * * 1,4'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  run-discovery-radar:
    name: Scan & Stage Pakistan Career Intakes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Execute Discovery & Structuring Script
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npx tsx scripts/discovery.ts
